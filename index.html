<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrewMy{Code} | Minimal Intelligence Systems</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,300;0,400;1,300&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Instrument Sans', 'sans-serif'],
              serif: ['Crimson Pro', 'serif'],
            },
            colors: {
              background: 'var(--color-bg)',
              surface: 'var(--color-surface)',
              text: 'var(--color-text)',
              'text-muted': 'var(--color-text-muted)',
              primary: 'var(--color-primary)',
              'primary-fg': 'var(--color-primary-fg)',
              border: 'var(--color-border)',
            },
            boxShadow: {
              recessed: 'var(--shadow-recessed)',
              'recessed-hover': 'var(--shadow-recessed-hover)',
            },
            animation: {
              'float': 'float 3s ease-in-out infinite',
              'fade-in': 'fadeIn 0.5s ease-out forwards',
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-10px)' },
              },
              fadeIn: {
                '0%': { opacity: '0', transform: 'translateY(10px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      :root {
        --color-bg: #ebeae6;
        --color-surface: #f4f3f0;
        --color-text: #121212;
        --color-text-muted: #71717a;
        --color-primary: #121212;
        --color-primary-fg: #ebeae6;
        --color-border: rgba(0,0,0,0.1);
        --shadow-recessed: inset 1px 1px 3px rgba(0,0,0,0.1), 1px 1px 2px rgba(255,255,255,0.8);
        --shadow-recessed-hover: inset 4px 4px 10px rgba(0,0,0,0.08);
      }
      
      .dark {
        --color-bg: #0f0f0f;
        --color-surface: #1a1a1a;
        --color-text: #ededed;
        --color-text-muted: #a1a1aa;
        --color-primary: #ededed;
        --color-primary-fg: #0f0f0f;
        --color-border: rgba(255,255,255,0.1);
        --shadow-recessed: inset 1px 1px 3px rgba(0,0,0,0.5), 1px 1px 2px rgba(255,255,255,0.05);
        --shadow-recessed-hover: inset 4px 4px 10px rgba(0,0,0,0.5);
      }

      body {
        background-color: var(--color-bg);
        color: var(--color-text);
        transition: background-color 0.3s ease, color 0.3s ease;
      }
      .letterpress {
        text-shadow: 0.5px 0.5px 0px rgba(255,255,255,0.5);
      }
      .dark .letterpress {
        text-shadow: 0.5px 0.5px 0px rgba(0,0,0,0.5);
      }
    </style>
