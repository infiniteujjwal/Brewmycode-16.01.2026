<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrewMy{Code} | Minimal Intelligence Systems</title>
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/4712/4712109.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,300;0,400;1,300&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Instrument Sans', 'sans-serif'],
              serif: ['Crimson Pro', 'serif'],
            },
            colors: {
              background: 'var(--color-bg)',
              surface: 'var(--color-surface)',
              text: 'var(--color-text)',
              'text-muted': 'var(--color-text-muted)',
              primary: 'var(--color-primary)',
              'primary-fg': 'var(--color-primary-fg)',
              border: 'var(--color-border)',
            },
            boxShadow: {
              recessed: 'var(--shadow-recessed)',
              'recessed-hover': 'var(--shadow-recessed-hover)',
            },
            animation: {
              'float': 'float 3s ease-in-out infinite',
              'fade-in': 'fadeIn 0.5s ease-out forwards',
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-10px)' },
              },
              fadeIn: {
                '0%': { opacity: '0', transform: 'translateY(10px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      :root {
        --color-bg: #ebeae6;
        --color-surface: #ffffff;
        --color-text: #121212;
        --color-text-muted: #5a5a5a;
        --color-primary: #121212;
        --color-primary-fg: #ffffff;
        --color-border: #e0e0e0;
        --shadow-recessed: inset 2px 2px 5px rgba(0,0,0,0.05), inset -2px -2px 5px rgba(255,255,255,0.5);
        --shadow-recessed-hover: inset 3px 3px 8px rgba(0,0,0,0.08), inset -3px -3px 8px rgba(255,255,255,0.8);
      }
      .dark {
        --color-bg: #0a0a0a;
        --color-surface: #121212;
        --color-text: #e0e0e0;
        --color-text-muted: #a0a0a0;
        --color-primary: #e0e0e0;
        --color-primary-fg: #000000;
        --color-border: #2a2a2a;
        --shadow-recessed: inset 2px 2px 5px rgba(0,0,0,0.5), inset -2px -2px 5px rgba(255,255,255,0.05);
        --shadow-recessed-hover: inset 3px 3px 8px rgba(0,0,0,0.8), inset -3px -3px 8px rgba(255,255,255,0.08);
      }
      body {
        background-color: var(--color-bg);
        color: var(--color-text);
        font-family: 'Instrument Sans', sans-serif;
      }
      .letterpress {
        text-shadow: 1px 1px 1px rgba(255,255,255,0.5), -1px -1px 1px rgba(0,0,0,0.1);
      }
      .dark .letterpress {
        text-shadow: 1px 1px 1px rgba(0,0,0,0.5), -1px -1px 1px rgba(255,255,255,0.1);
      }
    </style>
<script type="importmap">
{
  "imports": {
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-router-dom": "https://esm.sh/react-router-dom@^7.12.0",
    "@google/genai": "https://esm.sh/@google/genai@^1.37.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/"
  }
}
</script>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
